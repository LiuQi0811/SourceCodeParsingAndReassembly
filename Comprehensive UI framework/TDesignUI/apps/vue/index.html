<!doctype html>
<html lang="zh-CN" theme-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首帧前按存储/系统偏好定主题，避免从浅色闪到深色
      (function () {
        try {
          var saved = localStorage.getItem('tds-theme');
          var preferred =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('theme-mode', preferred);
        } catch (error) {
          /* 读不到就保持 index.html 上的默认浅色 */
        }
      })();
    </script>
    <title>TDesign UI</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
