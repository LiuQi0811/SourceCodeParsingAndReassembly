# TDesignUI CI
#
# 如果本目录就是仓库根，这份文件放在 .github/workflows/ 下即可直接生效。
# 如果仓库根在上一层（本目录是子目录），需要把文件移到仓库根的 .github/workflows/，
# 并给所有 run 步骤加上 working-directory 与 cache-dependency-path。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范
        run: npm run lint

      - name: core 单测
        run: npm test

      - name: 类型检查
        run: npm run typecheck

      - name: 双端构建
        run: npm run build:all
