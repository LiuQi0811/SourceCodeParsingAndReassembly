name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查 / 单测 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖（workspace）
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 类型检查
        run: npm run type-check

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 后台端构建（H5）
        run: npm run build:h5

      - name: 小程序端构建（微信）
        run: npm run build:mp

  e2e:
    name: 端到端测试
    runs-on: ubuntu-latest
    needs: quality
    env:
      # CI 上没有系统 Chrome，走 playwright 自带 Chromium
      PW_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖（workspace）
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E（自动拉起 dev server）
        run: npm run test:e2e

      - name: 失败时留存 trace / 截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/admin/test-results
            apps/admin/playwright-report
          retention-days: 7
