<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WebPlatform Lab —— 纯原生 JS+HTML+CSS 实现的 SPA，自研路由系统与类 Ant Design 组件库，覆盖 178 个 Web API 深度页面（W3C/WHATWG/TC39/CSSWG 截至 2025-2026 标准）。" />
  <title>WebPlatform Lab · Web 平台 API 实验室</title>
  <link rel="stylesheet" href="/assets/styles/variables.css" />
  <link rel="stylesheet" href="/assets/styles/reset.css" />
  <link rel="stylesheet" href="/assets/styles/base.css" />
  <link rel="stylesheet" href="/assets/styles/layout.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/pages.css" />
</head>
<body>
  <!-- 应用挂载点：所有自研组件均挂载于此，不使用 <a> 标签默认跳转 -->
  <div id="app">
    <div class="app-boot-loading">
      <div class="app-boot-spinner"></div>
      <p>正在加载 WebPlatform Lab…</p>
    </div>
  </div>

  <!-- 全局消息/通知容器（由 Message / Notification 工厂挂载） -->
  <div id="global-message-container" class="global-message-container" aria-live="polite"></div>
  <div id="global-notification-container" class="global-notification-container" aria-live="polite"></div>

  <!-- ES Module 入口：浏览器原生加载，零打包 -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
